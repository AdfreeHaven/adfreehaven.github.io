<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Portal - TestAdfreeHaven</title>
    
    <!-- Favicon (Book and Pen Emoji) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CORE STYLES --- */
        :root {
            --bg-gradient: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            --surface-color: rgba(255, 255, 255, 0.85);
            --text-main: #1d1d1f;
            --text-muted: #555555;
            --border-color: rgba(255, 255, 255, 0.4);
            --accent-color: #667eea;
            --accent-hover: #764ba2;
            --nav-bg: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 8px 32px rgba(0,0,0,0.08);
            --danger-color: #ff4757;
            --success-color: #2ed573;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30);
            --surface-color: rgba(20, 20, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: rgba(255, 255, 255, 0.1);
            --nav-bg: rgba(15, 15, 20, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        body { background: var(--bg-gradient); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: var(--text-main); min-height: 100vh; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* --- NAVBAR --- */
        nav { position: fixed; top: 0; width: 100%; height: 65px; background: var(--nav-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 1000; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05); }
        .logo { font-weight: 700; font-size: 1.3rem; background: -webkit-linear-gradient(45deg, var(--accent-color), var(--accent-hover)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;}
        .nav-actions { display: flex; align-items: center; gap: 15px; }
        .theme-toggle { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-main); outline: none; }
        .logout-btn { background: rgba(255, 71, 87, 0.1); color: var(--danger-color); border: 1px solid rgba(255, 71, 87, 0.3); padding: 8px 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .logout-btn:hover { background: var(--danger-color); color: white; }

        /* --- DASHBOARD LAYOUT --- */
        .container { padding: 90px 20px 40px; max-width: 1200px; margin: 0 auto; }
        
        .header-section { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        .header-section h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 5px; }
        .header-section p { color: var(--text-muted); font-size: 1rem; }
        
        /* --- TABS (Tests vs Courses) --- */
        .tabs { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;}
        .tab-btn { background: none; border: none; font-size: 1.1rem; font-weight: 600; color: var(--text-muted); cursor: pointer; padding: 5px 10px; position: relative; transition: color 0.3s; }
        .tab-btn.active { color: var(--accent-color); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -16px; left: 0; width: 100%; height: 3px; background: var(--accent-color); border-radius: 3px 3px 0 0; }

        /* --- SECTIONS --- */
        .section-content { display: none; }
        .section-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- TEST CARDS GRID --- */
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        .glass-card { background: var(--surface-color); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; padding: 25px; box-shadow: var(--card-shadow); border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.3s, box-shadow 0.3s; }
        .glass-card:hover { transform: translateY(-5px); box-shadow: 0 12px 40px rgba(0,0,0,0.15); }
        
        .card-header { margin-bottom: 15px; }
        .card-header h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3;}
        .meta-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .tag { font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: rgba(0,0,0,0.05); color: var(--text-main); }
        [data-theme="dark"] .tag { background: rgba(255,255,255,0.1); }
        .tag.free { background: rgba(46, 213, 115, 0.15); color: var(--success-color); }

        button.btn-primary { width: 100%; padding: 12px; border-radius: 12px; border: none; background: linear-gradient(45deg, var(--accent-color), var(--accent-hover)); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s, transform 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        button.btn-primary:active { transform: scale(0.98); }
        button.btn-primary:hover { opacity: 0.9; }

        /* Course Coming Soon Style */
        .coming-soon-banner { background: rgba(102, 126, 234, 0.1); border: 1px dashed var(--accent-color); border-radius: 20px; padding: 40px; text-align: center; }
        .coming-soon-banner h2 { color: var(--accent-color); margin-bottom: 10px; font-size: 1.8rem; }
        
        /* Loader */
        #pageLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gradient); z-index: 3000; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; color: var(--text-main); }
    </style>
</head>
<body>

    <div id="pageLoader">Loading Portal...</div>

    <nav>
        <div class="logo">TestAdfreeHaven</div>
        <div class="nav-actions">
            <span id="studentName" style="font-size: 0.95rem; font-weight: 600; margin-right: 10px;">Student</span>
            <button class="theme-toggle" id="themeBtn">🌙</button>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <div>
                <h1 id="welcomeText">Welcome back!</h1>
                <p>Ready to test your knowledge?</p>
            </div>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tests')">Available Tests</button>
            <button class="tab-btn" onclick="switchTab('courses')">My Courses 🌟</button>
        </div>

        <!-- TESTS SECTION -->
        <div id="testsSection" class="section-content active">
            <div id="testGrid" class="grid-layout">
                <!-- Tests will be injected here via JavaScript -->
                <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">
                    Checking for available tests...
                </div>
            </div>
        </div>

        <!-- COURSES SECTION (For Future Update) -->
        <div id="coursesSection" class="section-content">
            <div class="coming-soon-banner">
                <h2>🚀 Premium Courses Coming Soon!</h2>
                <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">
                    We are building high-quality study materials and video courses. 
                    This section will be updated soon. Stay tuned!
                </p>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA68qtMRSc_ypJLfp1_WrHj2WwTsn5tXwc",
            authDomain: "free-test-portal.firebaseapp.com",
            projectId: "free-test-portal",
            storageBucket: "free-test-portal.firebasestorage.app",
            messagingSenderId: "184523976049",
            appId: "1:184523976049:web:3afcd5b9a05495fcc39ad0",
            measurementId: "G-MSCQW35RM7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;

        // --- SECURITY & LOGIN CHECK ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    currentUserData = docSnap.data();
                    
                    // Admin redirect (if admin accidentally lands here)
                    if(currentUserData.role === "admin") {
                        window.location.href = "admin.html";
                        return;
                    }

                    // Setup Student UI
                    document.getElementById("pageLoader").style.display = "none";
                    const firstName = currentUserData.name.split(" ")[0];
                    document.getElementById("studentName").innerText = firstName;
                    document.getElementById("welcomeText").innerText = `Hello, ${firstName}!`;
                    
                    // Load Available Tests
                    fetchAndDisplayTests();
                } else {
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // --- LOGOUT LOGIC ---
        document.getElementById("logoutBtn").addEventListener("click", () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });

        // --- FETCH TESTS FROM FIREBASE ---
        async function fetchAndDisplayTests() {
            const testGrid = document.getElementById("testGrid");
            try {
                const querySnapshot = await getDocs(collection(db, "tests"));
                if (querySnapshot.empty) {
                    testGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px; border: 1px dashed var(--border-color); border-radius: 20px;">No tests are currently available. Check back later!</div>`;
                    return;
                }

                testGrid.innerHTML = "";
                
                querySnapshot.forEach((docSnap) => {
                    const test = docSnap.data();
                    const qCount = test.questions ? test.questions.length : 0;
                    const isFree = test.price === 0;
                    
                    // Do not show empty tests (optional safety check)
                    // if(qCount === 0) return; 

                    const card = document.createElement("div");
                    card.className = "glass-card";
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <h3>${test.title}</h3>
                            <div class="meta-tags">
                                <span class="tag">⏱ ${test.durationMinutes} Min</span>
                                <span class="tag">📝 ${qCount} Questions</span>
                                <span class="tag ${isFree ? 'free' : ''}">${isFree ? 'FREE' : '₹ ' + test.price}</span>
                            </div>
                        </div>
                        <button class="btn-primary" onclick="startTest('${test.testId}')">
                            ${isFree ? 'Start Test Now' : 'Unlock Test'}
                        </button>
                    `;
                    testGrid.appendChild(card);
                });
            } catch (error) {
                testGrid.innerHTML = `<div style="color: var(--danger-color); grid-column: 1 / -1;">Error loading tests. Please refresh the page.</div>`;
            }
        }

        // --- START TEST ACTION ---
       // --- START TEST ACTION ---
window.startTest = function(testId) {
    // Redirect to test engine with the specific test ID in URL
    window.location.href = "engine.html?id=" + testId;
}

        // --- TAB SWITCHER LOGIC ---
        window.switchTab = function(tabName) {
            const testsSection = document.getElementById('testsSection');
            const coursesSection = document.getElementById('coursesSection');
            const btns = document.querySelectorAll('.tab-btn');

            btns.forEach(btn => btn.classList.remove('active'));

            if(tabName === 'tests') {
                testsSection.classList.add('active');
                coursesSection.classList.remove('active');
                btns[0].classList.add('active');
            } else {
                testsSection.classList.remove('active');
                coursesSection.classList.add('active');
                btns[1].classList.add('active');
            }
        }

        // --- THEME TOGGLE ---
        const themeBtn = document.getElementById("themeBtn");
        if(localStorage.getItem("theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            themeBtn.innerText = "☀️";
        }
        themeBtn.addEventListener("click", () => {
            if(document.documentElement.getAttribute("data-theme") === "dark") {
                document.documentElement.removeAttribute("data-theme");
                localStorage.setItem("theme", "light");
                themeBtn.innerText = "🌙";
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem("theme", "dark");
                themeBtn.innerText = "☀️";
            }
        });

    </script>
</body>
</html>
