<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - TestAdfreeHaven</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CORE STYLES FROM INDEX.HTML --- */
        :root {
            --bg-gradient: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            --surface-color: rgba(255, 255, 255, 0.85);
            --text-main: #1d1d1f;
            --text-muted: #555555;
            --border-color: rgba(255, 255, 255, 0.4);
            --accent-color: #667eea;
            --accent-hover: #764ba2;
            --nav-bg: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 8px 32px rgba(0,0,0,0.08);
            --danger-color: #ff4757;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30);
            --surface-color: rgba(20, 20, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #00d2ff;
            --accent-hover: #3a7bd5;
            --nav-bg: rgba(15, 15, 20, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- NAVBAR --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            background: -webkit-linear-gradient(45deg, var(--accent-color), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-main);
            outline: none;
        }

        .logout-btn {
            background: rgba(255, 71, 87, 0.1);
            color: var(--danger-color);
            border: 1px solid rgba(255, 71, 87, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: var(--danger-color);
            color: white;
        }

        /* --- DASHBOARD LAYOUT --- */
        .container {
            padding: 90px 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-section {
            margin-bottom: 30px;
        }

        .header-section h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        .header-section p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        /* --- CARDS (Glassmorphism) --- */
        .glass-card {
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .glass-card h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* --- FORM ELEMENTS --- */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-main);
            font-weight: 500;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        [data-theme="dark"] .input-group input, [data-theme="dark"] .input-group select {
            background: rgba(0, 0, 0, 0.2);
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent-color);
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(45deg, var(--accent-color), var(--accent-hover));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button.btn-primary:hover { opacity: 0.9; }

        /* Loader */
        #pageLoader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- Security Loader (Hides content until admin is verified) -->
    <div id="pageLoader">Verifying Admin Access...</div>

    <nav>
        <div class="logo">Admin Panel - AdfreeHaven</div>
        <div class="nav-actions">
            <span id="adminName" style="font-size: 0.9rem; font-weight: 500;">Admin</span>
            <button class="theme-toggle" id="themeBtn">🌙</button>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Dashboard</h1>
            <p>Manage your tests, questions, and students from here.</p>
        </div>

        <div class="grid-container">
            <!-- Left Column: Create New Test -->
            <div class="glass-card">
                <h3>Create New Test</h3>
                <form id="createTestForm">
                    <div class="input-group">
                        <label>Test Title</label>
                        <input type="text" id="testTitle" placeholder="e.g. Computer Science Mock 1" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Duration (Minutes)</label>
                        <input type="number" id="testDuration" placeholder="e.g. 30" required>
                    </div>

                    <div class="input-group">
                        <label>Price (₹) - Enter 0 for Free</label>
                        <input type="number" id="testPrice" placeholder="0" required>
                    </div>

                    <button type="submit" class="btn-primary" id="createTestBtn">Create Test</button>
                    <div id="testMsg" style="margin-top:10px; font-size:0.85rem; color:#2ed573; text-align:center;"></div>
                </form>
            </div>

            <!-- Right Column: Existing Tests / Add Questions (UI Placeholder for now) -->
            <div class="glass-card">
                <h3>Your Tests</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">
                    Once you create a test, it will appear here. You can click on it to add questions.
                </p>
                <div id="testList" style="display:flex; flex-direction:column; gap:10px;">
                    <!-- Tests will be loaded here dynamically from Firebase later -->
                    <div style="padding: 15px; border-radius: 10px; border: 1px dashed var(--border-color); text-align: center; color: var(--text-muted);">
                        No tests created yet.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, setDoc, doc as docRef } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA68qtMRSc_ypJLfp1_WrHj2WwTsn5tXwc",
            authDomain: "free-test-portal.firebaseapp.com",
            projectId: "free-test-portal",
            storageBucket: "free-test-portal.firebasestorage.app",
            messagingSenderId: "184523976049",
            appId: "1:184523976049:web:3afcd5b9a05495fcc39ad0",
            measurementId: "G-MSCQW35RM7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Check: Is User Logged In & Is Admin?
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists() && docSnap.data().role === "admin") {
                    // Valid Admin
                    document.getElementById("pageLoader").style.display = "none";
                    document.getElementById("adminName").innerText = docSnap.data().name.split(" ")[0]; // Show First Name
                } else {
                    // Logged in but NOT Admin (Kick to index.html)
                    alert("Unauthorized Access! Only Admins allowed.");
                    window.location.href = "index.html";
                }
            } else {
                // Not logged in at all
                window.location.href = "index.html";
            }
        });

        // Logout Logic
        document.getElementById("logoutBtn").addEventListener("click", () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            });
        });

        // Create Test Logic (Saving to Firestore Database)
        document.getElementById("createTestForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("createTestBtn");
            const msg = document.getElementById("testMsg");
            
            const title = document.getElementById("testTitle").value;
            const duration = parseInt(document.getElementById("testDuration").value);
            const price = parseInt(document.getElementById("testPrice").value);

            btn.innerText = "Creating...";
            
            try {
                // Generate a unique ID based on timestamp
                const testId = "test_" + Date.now();
                
                await setDoc(docRef(db, "tests", testId), {
                    testId: testId,
                    title: title,
                    durationMinutes: duration,
                    price: price,
                    isPaid: price > 0,
                    createdAt: new Date().toISOString()
                });

                msg.style.color = "#2ed573";
                msg.innerText = "Test created successfully!";
                document.getElementById("createTestForm").reset();
                
                setTimeout(() => { msg.innerText = ""; }, 3000);
                
                // TODO in Next Step: Reload test list on the right side
                
            } catch (error) {
                msg.style.color = "#ff4757";
                msg.innerText = "Error: " + error.message;
            } finally {
                btn.innerText = "Create Test";
            }
        });

        // Theme Toggle Logic
        const themeBtn = document.getElementById("themeBtn");
        if(localStorage.getItem("theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            themeBtn.innerText = "☀️";
        }
        themeBtn.addEventListener("click", () => {
            if(document.documentElement.getAttribute("data-theme") === "dark") {
                document.documentElement.removeAttribute("data-theme");
                localStorage.setItem("theme", "light");
                themeBtn.innerText = "🌙";
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem("theme", "dark");
                themeBtn.innerText = "☀️";
            }
        });

    </script>
</body>
</html>
