<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Meta Tags -->
    <title>TestAdfreeHaven - Online Examination & Assessment Portal</title>
    <meta name="description" content="TestAdfreeHaven is a secure, interactive, and seamless online examination portal for students and administrators. Participate in tests and view results instantly.">
    <meta name="keywords" content="Online Test, Examination Portal, Student Login, Admin Dashboard, TestAdfreeHaven, Jalap Group, Online Assessment, Computer Science Mock Test">
    <meta name="author" content="Team Adfree Haven | Powered by Jalap Group">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ffffff" id="theme-color-meta">

    <!-- Open Graph / Facebook / WhatsApp Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adfreehaven.github.io/TestAdfreeHaven/">
    <meta property="og:title" content="TestAdfreeHaven - Online Examination Portal">
    <meta property="og:description" content="Interactive and secure online examination portal. Sign in to start your test journey.">
    <meta property="og:image" content="logo.jpeg"> 

    <!-- Twitter Meta Tags -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://adfreehaven.github.io/TestAdfreeHaven/">
    <meta property="twitter:title" content="TestAdfreeHaven - Online Examination Portal">
    <meta property="twitter:description" content="Interactive and secure online examination portal. Sign in to start your test journey.">
    <meta property="twitter:image" content="logo.jpeg">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="logo.jpeg"> 
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            --surface-color: rgba(255, 255, 255, 0.85);
            --text-main: #1d1d1f;
            --text-muted: #555555;
            --border-color: rgba(255, 255, 255, 0.4);
            --accent-color: #667eea;
            --accent-hover: #764ba2;
            --nav-bg: rgba(255, 255, 255, 0.6);
            --google-btn: #ffffff;
            --google-text: #333333;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30);
            --surface-color: rgba(20, 20, 25, 0.85);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #00d2ff;
            --accent-hover: #3a7bd5;
            --nav-bg: rgba(15, 15, 20, 0.6);
            --google-btn: #2a2a2a;
            --google-text: #ffffff;
        }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* No Scrolling */
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        nav img {
            height: 35px;          
            width: auto;           
            border-radius: 8px;    
            object-fit: contain;  
            vertical-align: middle; 
            margin-right: 10px;      
        }

        .logo {
            font-weight: 700;
            font-size: 1.3rem;
            background: -webkit-linear-gradient(45deg, var(--accent-color), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-main);
            outline: none;
            transition: transform 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 60px;
            padding: 10px 20px;
        }

        .auth-card {
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 380px;
            padding: 25px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            text-align: center;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-card h2 {
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 1.6rem;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: var(--text-main);
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            box-sizing: border-box;
        }

        [data-theme="dark"] .input-group input {
            background: rgba(0, 0, 0, 0.2);
        }

        .input-group input:focus {
            border-color: var(--accent-color);
            background: transparent;
        }

        /* Naya Forgot Password CSS */
        .forgot-password-container {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 15px;
        }

        .forgot-password-container a {
            font-size: 0.8rem;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot-password-container a:hover {
            text-decoration: underline;
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(45deg, var(--accent-color), var(--accent-hover));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button.btn-primary:active {
            transform: scale(0.98);
        }

        button.btn-primary:hover {
            opacity: 0.9;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span {
            padding: 0 10px;
        }

        button.btn-google {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--google-btn);
            color: var(--google-text);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }

        button.btn-google:hover {
            background: rgba(128, 128, 128, 0.1);
        }

        .toggle-form {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .toggle-form a {
            color: var(--accent-color);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        #message {
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            min-height: 20px;
        }

        .footer-credit {
            text-align: center;
            padding: 10px;
            font-size: 0.7rem;
            color: var(--text-main);
            opacity: 0.7;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <img src="logo.jpeg" alt="TestAdfreeHaven Logo">
            <div class="logo">TestAdfreeHaven</div>
        </div>
        <button class="theme-toggle" id="themeBtn" aria-label="Toggle Theme">🌙</button>
    </nav>

    <div class="container">
        <div class="auth-card">
            <h2 id="formTitle">Welcome Back</h2>
            <p id="formSubtitle">Sign in to continue your journey.</p>

            <div id="nameField" class="input-group" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="userName" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="userEmail" placeholder="name@example.com">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="userPassword" placeholder="••••••••">
            </div>
            
            <!-- Naya Forgot Password Link -->
            <div class="forgot-password-container" id="forgotPwdContainer">
                <a id="forgotPwdBtn">Forgot Password?</a>
            </div>

            <button class="btn-primary" id="actionBtn">Sign In</button>

            <div class="divider"><span>OR</span></div>

            <button class="btn-google" id="googleBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>

            <div id="message"></div>

            <div class="toggle-form">
                <span id="toggleText">New here? </span>
                <a id="toggleBtn">Create an account</a>
            </div>
        </div>
    </div>

    <div class="footer-credit">
        MADE BY TEAM ADFREE HAVEN | POWERED BY JALAPGROUP
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        // Yahan sendPasswordResetEmail ko import list mein add kar diya gaya hai
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA68qtMRSc_ypJLfp1_WrHj2WwTsn5tXwc",
            authDomain: "free-test-portal.firebaseapp.com",
            projectId: "free-test-portal",
            storageBucket: "free-test-portal.firebasestorage.app",
            messagingSenderId: "184523976049",
            appId: "1:184523976049:web:3afcd5b9a05495fcc39ad0",
            measurementId: "G-MSCQW35RM7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let isLogin = true;
        const formTitle = document.getElementById("formTitle");
        const formSubtitle = document.getElementById("formSubtitle");
        const nameField = document.getElementById("nameField");
        const actionBtn = document.getElementById("actionBtn");
        const toggleBtn = document.getElementById("toggleBtn");
        const toggleText = document.getElementById("toggleText");
        const messageBox = document.getElementById("message");
        const googleBtn = document.getElementById("googleBtn");
        const forgotPwdContainer = document.getElementById("forgotPwdContainer");
        const forgotPwdBtn = document.getElementById("forgotPwdBtn");

        toggleBtn.addEventListener("click", () => {
            isLogin = !isLogin;
            messageBox.innerText = "";
            if(isLogin) {
                formTitle.innerText = "Welcome Back";
                formSubtitle.innerText = "Sign in to continue your journey.";
                nameField.style.display = "none";
                forgotPwdContainer.style.display = "block"; // Login me dikhega
                actionBtn.innerText = "Sign In";
                toggleText.innerText = "New here? ";
                toggleBtn.innerText = "Create an account";
            } else {
                formTitle.innerText = "Join Us";
                formSubtitle.innerText = "Create an account to start testing.";
                nameField.style.display = "block";
                forgotPwdContainer.style.display = "none"; // Signup me nahi dikhega
                actionBtn.innerText = "Sign Up";
                toggleText.innerText = "Already have an account? ";
                toggleBtn.innerText = "Sign In";
            }
        });

        async function handleUserRole(user, nameStr) {
            const docSnap = await getDoc(doc(db, "users", user.uid));
            if (!docSnap.exists()) {
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    name: nameStr || user.displayName || "User",
                    email: user.email,
                    role: "student", 
                    purchasedTests: [] 
                });
                return "student";
            } else {
                return docSnap.data().role;
            }
        }

        // REDIRECT FUNCTION
        function redirectUser(role) {
            if(role === "admin") {
                window.location.href = "admin"; // Create this file next
            } else {
                window.location.href = "student"; // Create this file next
            }
        }

        actionBtn.addEventListener("click", async () => {
            const email = document.getElementById("userEmail").value;
            const password = document.getElementById("userPassword").value;
            const name = document.getElementById("userName").value;
            
            messageBox.style.color = "#ff4757"; 
            messageBox.innerText = "Processing...";

            try {
                if(isLogin) {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const role = await handleUserRole(userCredential.user, "");
                    messageBox.style.color = "#2ed573"; 
                    messageBox.innerText = `Success! Redirecting...`;
                    setTimeout(() => redirectUser(role), 800);
                } else {
                    if(name.trim() === "") throw new Error("Name is required!");
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await handleUserRole(userCredential.user, name);
                    messageBox.style.color = "#2ed573";
                    messageBox.innerText = "Account Created! Redirecting...";
                    setTimeout(() => toggleBtn.click(), 1500);
                }
            } catch (error) {
                messageBox.innerText = error.message.replace("Firebase:", "").trim();
            }
        });

        // FORGOT PASSWORD FUNCTION
        forgotPwdBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            const email = document.getElementById("userEmail").value.trim();
            
            if(!email) {
                messageBox.style.color = "#ff4757";
                messageBox.innerText = "Please enter your email address first to reset password.";
                return;
            }

            messageBox.style.color = "var(--text-main)";
            messageBox.innerText = "Sending password reset link...";

            try {
                await sendPasswordResetEmail(auth, email);
                messageBox.style.color = "#2ed573";
                messageBox.innerText = "Password reset link sent! Please check your email.";
            } catch (error) {
                messageBox.style.color = "#ff4757";
                messageBox.innerText = error.message.replace("Firebase:", "").trim();
            }
        });

        googleBtn.addEventListener("click", async () => {
            messageBox.style.color = "var(--text-main)";
            messageBox.innerText = "Opening Google Sign-In...";
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const role = await handleUserRole(result.user, result.user.displayName);
                messageBox.style.color = "#2ed573";
                messageBox.innerText = `Success! Redirecting...`;
                setTimeout(() => redirectUser(role), 800);
            } catch (error) {
                messageBox.style.color = "#ff4757";
                messageBox.innerText = error.message.replace("Firebase:", "").trim();
            }
        });

        const themeBtn = document.getElementById("themeBtn");
        const themeMeta = document.getElementById("theme-color-meta");
        
        if(localStorage.getItem("theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            themeBtn.innerText = "☀️";
            themeMeta.setAttribute("content", "#141e30");
        }

        themeBtn.addEventListener("click", () => {
            if(document.documentElement.getAttribute("data-theme") === "dark") {
                document.documentElement.removeAttribute("data-theme");
                localStorage.setItem("theme", "light");
                themeBtn.innerText = "🌙";
                themeMeta.setAttribute("content", "#ffffff");
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem("theme", "dark");
                themeBtn.innerText = "☀️";
                themeMeta.setAttribute("content", "#141e30");
            }
        });
    </script>
</body>
</html>
