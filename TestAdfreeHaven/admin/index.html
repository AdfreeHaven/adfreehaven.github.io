<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - TestAdfreeHaven</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-gradient: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb); --surface-color: rgba(255, 255, 255, 0.85); --text-main: #1d1d1f; --text-muted: #555555; --border-color: rgba(255, 255, 255, 0.4); --accent-color: #667eea; --accent-hover: #764ba2; --nav-bg: rgba(255, 255, 255, 0.6); --danger-color: #ff4757; }
        [data-theme="dark"] { --bg-gradient: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30); --surface-color: rgba(20, 20, 25, 0.85); --text-main: #ffffff; --text-muted: #aaaaaa; --border-color: rgba(255, 255, 255, 0.1); --nav-bg: rgba(15, 15, 20, 0.6); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        body { background: var(--bg-gradient); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: var(--text-main); min-height: 100vh; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        nav { position: fixed; top: 0; width: 100%; height: 60px; background: var(--nav-bg); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; z-index: 1000; }
        .logo { font-weight: 700; font-size: 1.2rem; background: -webkit-linear-gradient(45deg, var(--accent-color), var(--accent-hover)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-actions { display: flex; align-items: center; gap: 15px; }
        .theme-toggle, .logout-btn { background: none; border: none; cursor: pointer; color: var(--text-main); }
        .logout-btn { background: rgba(255, 71, 87, 0.1); color: var(--danger-color); border: 1px solid rgba(255, 71, 87, 0.3); padding: 6px 12px; border-radius: 8px; font-weight: 600; }
        .container { padding: 90px 20px 40px; max-width: 1200px; margin: 0 auto; }
        .grid-container { display: grid; grid-template-columns: 1fr 2fr; gap: 25px; }
        @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
        .glass-card { background: var(--surface-color); backdrop-filter: blur(20px); border-radius: 20px; padding: 25px; border: 1px solid var(--border-color); }
        .glass-card h3 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; font-weight: 500; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255, 255, 255, 0.2); color: var(--text-main); font-family: inherit; outline: none; }
        [data-theme="dark"] .input-group input, [data-theme="dark"] .input-group select, [data-theme="dark"] .input-group textarea { background: rgba(0, 0, 0, 0.2); }
        button.btn-primary { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(45deg, var(--accent-color), var(--accent-hover)); color: white; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .test-item { padding: 15px; border-radius: 12px; background: rgba(255,255,255,0.15); border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .test-info h4 { margin-bottom: 4px; }
        .test-info span { font-size: 0.8rem; background: var(--border-color); padding: 3px 8px; border-radius: 5px; margin-right: 5px;}
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        #pageLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gradient); z-index: 3000; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>
    <div id="pageLoader">Verifying Admin Access...</div>
    <nav>
        <div class="logo">Admin Panel</div>
        <div class="nav-actions">
            <span id="adminName" style="font-size: 0.9rem; font-weight: 500;">Admin</span>
            <button class="theme-toggle" id="themeBtn">🌙</button>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container">
        <div class="grid-container">
            <div class="glass-card" style="height: fit-content;">
                <h3>Create New Test</h3>
                <form id="createTestForm">
                    <div class="input-group"><label>Test Title</label><input type="text" id="testTitle" required></div>
                    <div class="input-group"><label>Duration (Minutes)</label><input type="number" id="testDuration" required></div>
                    <div class="input-group"><label>Price (₹) - 0 for Free</label><input type="number" id="testPrice" required></div>
                    <button type="submit" class="btn-primary" id="createTestBtn">Create Test</button>
                    <div id="testMsg" style="margin-top:10px; color:#2ed573; text-align:center;"></div>
                </form>
            </div>
            <div class="glass-card">
                <h3>Your Active Tests</h3>
                <div id="testList"></div>
            </div>
        </div>
    </div>

    <!-- Question Modal -->
    <div id="questionModal" class="modal-overlay">
        <div class="glass-card modal-content">
            <h3 id="modalTestTitle">Add Question</h3>
            <form id="addQuestionForm">
                <div class="input-group"><label>Question Text</label><textarea id="qText" rows="2" required></textarea></div>
                
                <!-- NEW: Image URL -->
                <div class="input-group">
                    <label>Image URL (Optional - Leave blank if none)</label>
                    <input type="url" id="qImage" placeholder="https://example.com/image.png">
                </div>

                <div class="input-group"><label>Option A</label><input type="text" id="optA" required></div>
                <div class="input-group"><label>Option B</label><input type="text" id="optB" required></div>
                <div class="input-group"><label>Option C</label><input type="text" id="optC" required></div>
                <div class="input-group"><label>Option D</label><input type="text" id="optD" required></div>
                <div class="input-group">
                    <label>Correct Answer</label>
                    <select id="qCorrect" required>
                        <option value="0">Option A</option><option value="1">Option B</option>
                        <option value="2">Option C</option><option value="3">Option D</option>
                    </select>
                </div>
                
                <!-- NEW: Explanation -->
                <div class="input-group">
                    <label>Solution / Explanation (Optional)</label>
                    <textarea id="qExplanation" rows="2" placeholder="Explain the correct answer..."></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="input-group" style="flex: 1;"><label>Marks</label><input type="number" id="qMarks" value="2" required></div>
                    <div class="input-group" style="flex: 1;"><label>Negative</label><input type="number" step="0.1" id="qNegative" value="0.5" required></div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn-primary" style="flex: 2;">Save Question</button>
                    <button type="button" class="btn-primary" id="closeModalBtn" style="flex: 1; background: var(--danger-color);">Cancel</button>
                </div>
                <div id="qMsg" style="margin-top:10px; color:#2ed573; text-align:center;"></div>
            </form>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, setDoc, getDocs, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
        
        const firebaseConfig = { apiKey: "AIzaSyA68qtMRSc_ypJLfp1_WrHj2WwTsn5tXwc", authDomain: "free-test-portal.firebaseapp.com", projectId: "free-test-portal", storageBucket: "free-test-portal.firebasestorage.app", messagingSenderId: "184523976049", appId: "1:184523976049:web:3afcd5b9a05495fcc39ad0" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists() && docSnap.data().role === "admin") {
                    document.getElementById("pageLoader").style.display = "none";
                    document.getElementById("adminName").innerText = docSnap.data().name.split(" ")[0];
                    loadTests();
                } else window.location.href = "index.html";
            } else window.location.href = "index.html";
        });

        document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth).then(() => window.location.href = "index.html"));

        async function loadTests() {
            const testList = document.getElementById("testList");
            const querySnapshot = await getDocs(collection(db, "tests"));
            testList.innerHTML = "";
            querySnapshot.forEach((docSnap) => {
                const test = docSnap.data();
                const qCount = test.questions ? test.questions.length : 0;
                testList.innerHTML += `<div class="test-item">
                    <div class="test-info"><h4>${test.title}</h4><span>⏱ ${test.durationMinutes} Min</span><span>📝 ${qCount} Qs</span></div>
                    <button class="btn-primary" style="width:auto; padding:6px 12px; margin:0;" data-id="${test.testId}">+ Add Qs</button>
                </div>`;
            });
        }

        document.getElementById("createTestForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const testId = "test_" + Date.now();
            await setDoc(doc(db, "tests", testId), { testId, title: document.getElementById("testTitle").value, durationMinutes: parseInt(document.getElementById("testDuration").value), price: parseInt(document.getElementById("testPrice").value), isPaid: parseInt(document.getElementById("testPrice").value) > 0, questions: [], createdAt: new Date().toISOString() });
            e.target.reset(); loadTests();
        });

        let currentTestId = "";
        document.getElementById("testList").addEventListener("click", (e) => {
            if (e.target.tagName === "BUTTON") { currentTestId = e.target.getAttribute("data-id"); document.getElementById("questionModal").style.display = "flex"; }
        });
        document.getElementById("closeModalBtn").addEventListener("click", () => { document.getElementById("questionModal").style.display = "none"; document.getElementById("addQuestionForm").reset(); });

        document.getElementById("addQuestionForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector("button[type='submit']"); btn.innerText = "Saving...";
            const newQuestion = {
                id: Date.now(),
                question: document.getElementById("qText").value,
                imageUrl: document.getElementById("qImage").value || null,
                options: [document.getElementById("optA").value, document.getElementById("optB").value, document.getElementById("optC").value, document.getElementById("optD").value],
                correctAnswer: parseInt(document.getElementById("qCorrect").value),
                explanation: document.getElementById("qExplanation").value || null,
                marks: parseFloat(document.getElementById("qMarks").value),
                negativeMarks: parseFloat(document.getElementById("qNegative").value)
            };
            await updateDoc(doc(db, "tests", currentTestId), { questions: arrayUnion(newQuestion) });
            e.target.reset(); btn.innerText = "Save Question"; loadTests();
        });

        const themeBtn = document.getElementById("themeBtn");
        if(localStorage.getItem("theme") === "dark") { document.documentElement.setAttribute("data-theme", "dark"); themeBtn.innerText = "☀️"; }
        themeBtn.addEventListener("click", () => {
            if(document.documentElement.getAttribute("data-theme") === "dark") { document.documentElement.removeAttribute("data-theme"); localStorage.setItem("theme", "light"); themeBtn.innerText = "🌙"; }
            else { document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("theme", "dark"); themeBtn.innerText = "☀️"; }
        });
    </script>
</body>
</html>
